# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: workshop-verified-retrieval
services:
    ai-project:
        host: azure.ai.project
        endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
    echo-activity:
        project: src/echo-activity
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        agentEndpoint:
            authorizationSchemes:
                - type: Entra
                - type: BotServiceRbac
            protocols:
                - activity
                - invocations
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            Verify actual retrieval records against a pinned licensed corpus and render complete source passages with individual source markers before Activity or stateless Invocations delivery.
        displayName: Verified workshop retrieval
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Activity Protocol
                - Bring Your Own
                - Python
        name: workshop-verified-retrieval
        protocols:
            - protocol: activity
              version: 2.0.0
            - protocol: invocations
              version: 2.0.0
        env:
            WORKSHOP_LISTEN_HOST: "0.0.0.0"
            FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            WORKSHOP_SEARCH_ENDPOINT: ${WORKSHOP_SEARCH_ENDPOINT}
            WORKSHOP_RETRIEVAL_AGENT: ${WORKSHOP_RETRIEVAL_AGENT}
            WORKSHOP_RETRIEVAL_VERSION: ${WORKSHOP_RETRIEVAL_VERSION}
infra:
    provider: microsoft.foundry
