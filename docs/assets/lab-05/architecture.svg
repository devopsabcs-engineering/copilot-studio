<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc">
  <title id="title">Lab 5 original architecture diagram / Schéma original de l'atelier 5</title>
  <desc id="desc">Private documents are chunked and embedded into Search. A standard Copilot Studio agent retrieves passages and answers with citations. Schéma pédagogique, sans preuve de déploiement.</desc>
  <rect width="1120" height="280" fill="#f5f8fc"/>
  <g fill="#fff" stroke="#294b75" stroke-width="2">
    <rect x="20" y="70" width="240" height="120" rx="12"/>
    <rect x="300" y="70" width="240" height="120" rx="12"/>
    <rect x="580" y="70" width="240" height="120" rx="12"/>
    <rect x="860" y="70" width="240" height="120" rx="12"/>
  </g>
  <g stroke="#294b75" stroke-width="3" fill="none">
    <path d="M260 130h40m-10-7 10 7-10 7"/>
    <path d="M540 130h40m-10-7 10 7-10 7"/>
    <path d="M820 130h40m-10-7 10 7-10 7"/>
  </g>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle" fill="#172d49">
    <text x="560" y="32" font-size="20">Original diagram / Schéma original (not a screenshot / pas une capture)</text>
    <text x="140" y="106" font-size="18">Private Blob documents</text>
    <text x="140" y="136" font-size="17">Documents Blob privés</text>
    <text x="140" y="168" font-size="15">Authorized fixtures / Essais autorisés</text>
    <text x="420" y="106" font-size="18">Split + embeddings</text>
    <text x="420" y="136" font-size="17">Découpage + plongements</text>
    <text x="420" y="168" font-size="15">Indexer / Indexeur</text>
    <text x="700" y="106" font-size="18">Azure AI Search</text>
    <text x="700" y="136" font-size="17">Passages + vectors / vecteurs</text>
    <text x="700" y="168" font-size="15">Source URLs / URL des sources</text>
    <text x="980" y="106" font-size="18">Copilot Studio (standard)</text>
    <text x="980" y="136" font-size="17">Grounded answer / sourcée</text>
    <text x="980" y="168" font-size="15">Knowledge or flow / ou flux</text>
    <text x="560" y="234" font-size="17">Identity + permissions + network on every boundary / Identité + droits + réseau à chaque frontière</text>
    <text x="560" y="260" font-size="15">Source/static review only / Revue des sources et analyse statique uniquement</text>
  </g>
</svg>
